name: Documentation checks

on:
  push:
    branches: [main]
    paths:
      - README.md
      - gitprimer.md
      - scripts/check_docs.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - README.md
      - gitprimer.md
      - scripts/check_docs.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source formatting, images, links and anchors
        run: python scripts/check_docs.py --external
