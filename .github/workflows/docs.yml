name: Documentation checks

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - scripts/**
      - tests/**
      - requirements-docs.txt
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - '**/*.md'
      - scripts/**
      - tests/**
      - requirements-docs.txt
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Verify checker behavior
        run: python -m unittest discover -s tests
      - name: Render Markdown and check tables, links and source formatting
        run: python scripts/check_docs.py --external --render-dir work/rendered-docs
      - name: Save rendered pages for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-docs
          path: work/rendered-docs/**/*.html
          if-no-files-found: warn
          retention-days: 7
